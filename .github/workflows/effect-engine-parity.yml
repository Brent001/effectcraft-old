name: Effect engine parity

on:
  push:
    branches:
      - integration/official-effects-engine-parity
  pull_request:
    paths:
      - "crates/effects/**"
      - "crates/gpu/**"
      - ".github/workflows/effect-engine-parity.yml"

permissions:
  contents: read

jobs:
  effect-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Test CPU effect semantics
        run: cargo test --locked -p effectcraft-effects
      - name: Check render and GPU integration
        run: cargo check --locked -p effectcraft-render -p effectcraft-gpu
