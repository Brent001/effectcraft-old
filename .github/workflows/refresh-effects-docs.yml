name: Refresh generated effects docs

on:
  push:
    branches:
      - ci/fix-release-actions

permissions:
  contents: write

concurrency:
  group: refresh-effects-docs
  cancel-in-progress: false

jobs:
  refresh-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Regenerate docs/effects.md from the source registry
        env:
          UPDATE_DOCS: "1"
        run: cargo test --locked -p effectcraft-effects --lib effects_doc_is_current
      - name: Commit regenerated documentation
        shell: bash
        run: |
          if git diff --quiet -- docs/effects.md; then
            echo "docs/effects.md is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/effects.md
          git commit -m "docs: refresh generated effects catalogue"
          git push origin HEAD:ci/fix-release-actions
      - name: Verify effects tests after refresh
        run: cargo test --locked -p effectcraft-effects
